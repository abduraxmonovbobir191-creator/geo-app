name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # The android/ folder is generated here, then patched with permissions and the app name.
      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name=nex_map --org uz.nexmap
          bash tool/configure_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
      # to your server, e.g. https://api.nexmap.uz. Without it the app talks to the emulator host.
      - name: Build universal APK
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64
          --dart-define=API_URL=${{ vars.API_URL || 'http://10.0.2.2:3000' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nex-map-apk
          path: build/app/outputs/flutter-apk/app-release.apk
