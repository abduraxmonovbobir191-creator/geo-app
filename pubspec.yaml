name: nex_map
description: Nex Map - map, friends' live locations and activity tracking in one app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.2.0
  flutter_map: ^8.1.1
  geolocator: ^14.0.0
  http: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
